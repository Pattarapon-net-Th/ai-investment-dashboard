<!DOCTYPE html>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        body {
            font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-overflow-scrolling: touch;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        .fade-in {
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 1rem);
        }
        .pt-safe {
            padding-top: env(safe-area-inset-top, 0px);
        }
    </style>
</head>

                                >

                                    <span className="text-[11px] mt-1">{item.label}</span>

                                onOpenHistoryDrawer={() => setIsHistoryDrawerOpen(true)}
                                slotsCount={datasetSlots.length}
                                activeSlotIndex={activeSlotIndex}
                            />
                        )}
                    </main>

                    {/* Collapsible History Drawer / Popover */}
                    <HistoryDrawerPopup 
                        slots={datasetSlots}
                        activeSlotIndex={activeSlotIndex}
                        setActiveSlotIndex={setActiveSlotIndex}
                        isOpen={isHistoryDrawerOpen}
                        setIsOpen={setIsHistoryDrawerOpen}
                    />

                                <div className="w-12 h-12 bg-indigo-50 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-indigo-100">
                                    <Icons.QrCode />
                                </div>

                                <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200/80 inline-block mb-4 shadow-inner">

                                </div>

                                <div className="bg-indigo-50/70 p-3 rounded-xl border border-indigo-100 text-[11px] text-indigo-900 font-medium select-all break-all">
                                    {CURRENT_PAGE_URL}

                            </div>
                        </div>
                    )}

                    {isUploadModalOpen && (

                                <button 
                                    onClick={() => setIsUploadModalOpen(false)}
                                    className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1 rounded-lg"
                                >
                                    <Icons.Close />
                                </button>

                                {uploadState === 'idle' && (
                                    <div className="text-center py-2 sm:py-4">
                                        <div className="w-14 h-14 sm:w-16 sm:h-16 bg-blue-50 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-blue-100">
                                            <Icons.FileText />
                                        </div>
                                        <h3 className="text-base sm:text-lg font-bold text-slate-900 mb-1">อัปเดตข้อมูลด้วยไฟล์ PDF</h3>
                                        <p className="text-xs text-slate-500 mb-5 leading-relaxed">
                                            เลือกไฟล์ PDF รายงานการลงทุน เพื่อสแกนดึงข้อมูลและอัปเดต Dashboard บนสมาร์ตโฟน/iPad ของคุณทันที
                                        </p>
                                        
                                        <input 
                                            type="file" 
                                            ref={fileInputRef} 
                                            onChange={handleFileChange} 
                                            accept=".pdf" 
                                            className="hidden" 
                                        />
                                        
                                        <button 
                                            onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                            className="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold py-3 px-4 rounded-xl transition-all shadow-md flex items-center justify-center text-xs sm:text-sm min-h-[44px]"
                                        >
                                            <Icons.Upload /> เลือกไฟล์ PDF จากเครื่อง
                                        </button>
                                    </div>
                                )}

                                {uploadState === 'parsing' && (
                                    <div className="text-center py-6 sm:py-8">
                                        <Icons.Spinner />
                                        <h3 className="text-base sm:text-lg font-bold text-slate-900 mb-1">กำลังอ่านไฟล์ PDF...</h3>
                                        <p className="text-xs text-slate-500">({uploadedFileName})</p>
                                    </div>
                                )}

                                {uploadState === 'success' && (
                                    <div className="text-center py-4 sm:py-6">
                                        <Icons.CheckCircle />
                                        <h3 className="text-base sm:text-lg font-bold text-slate-900 mb-1">สแกนสำเร็จ!</h3>
                                        <p className="text-xs text-slate-600 mb-2">ไฟล์: <span className="font-semibold text-blue-600">{uploadedFileName}</span></p>
                                        {parsedSnippet && (
                                            <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 text-[11px] text-slate-600 text-left max-h-24 overflow-y-auto mb-2">
                                                <span className="font-semibold text-slate-800">ข้อมูลที่อ่านได้:</span> {parsedSnippet}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

                                )}

                                    <div className="text-center py-4 sm:py-6">
                                        <Icons.CheckCircle />
                                        <h3 className="text-base sm:text-lg font-bold text-slate-900 mb-1">อัปเดตสำเร็จ!</h3>
                                        <p className="text-xs text-slate-600 mb-2">ไฟล์: <span className="font-semibold text-blue-600">{uploadedFileName}</span></p>
                                        {parsedSnippet && (
                                            <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 text-[11px] text-slate-600 text-left max-h-24 overflow-y-auto mb-2">
                                                <span className="font-semibold text-slate-800">ข้อมูลที่อ่านได้:</span> {parsedSnippet}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
