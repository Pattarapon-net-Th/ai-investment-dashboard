        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        body {
            font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-overflow-scrolling: touch;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        .fade-in {
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeIn {

        }
        .pt-safe {
            padding-top: env(safe-area-inset-top, 0px);
        }
        /* Custom Google Doc Container Styles */
        .gdoc-wrapper {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 1.25rem;
            padding: 1.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }
        @media (min-width: 640px) {
            .gdoc-wrapper {
                padding: 2rem;
            }
        }
        .gdoc-wrapper table {
            width: 100% !important;
            border-collapse: collapse !important;
            margin: 1.25rem 0 !important;
            font-size: 0.875rem !important;
        }
        .gdoc-wrapper td, .gdoc-wrapper th {
            border: 1px solid #cbd5e1 !important;
            padding: 0.75rem 1rem !important;
            text-align: left !important;
        }
        .gdoc-wrapper th {
            background-color: #f1f5f9 !important;
            font-weight: 700 !important;
            color: #1e293b !important;
        }
        .gdoc-wrapper p {
            margin-bottom: 0.75rem !important;
            line-height: 1.65 !important;
            color: #334155 !important;
        }
        .gdoc-wrapper ul, .gdoc-wrapper ol {
            padding-left: 1.5rem !important;
            margin-bottom: 1rem !important;
        }
        .gdoc-wrapper li {
            margin-bottom: 0.4rem !important;
            line-height: 1.6 !important;
        }
        .gdoc-wrapper a {
            color: #2563eb !important;
            text-decoration: underline !important;
        }

</head>

                        </div>
                        <div className="bg-white rounded-2xl p-5 sm:p-6 border border-slate-100 shadow-sm flex flex-col justify-center">
                            <p className="text-slate-500 text-xs sm:text-sm mb-1">สัดส่วนเงินสด (Cash / Dry Powder)</p>
                            <h3 className="text-xl sm:text-2xl font-bold text-slate-800 mb-1">{currentSlot.cashShare}</h3>
                        </div>
                    </div>
                </div>
            );
        };

        const ReportTab = ({ fetchedHtml, onOpenQr }) => {
            if (fetchedHtml) {
                return (
                    <div className="fade-in space-y-4 pb-10">
                        <div className="bg-white rounded-2xl p-4 sm:p-6 border border-slate-100 shadow-xs flex justify-between items-center">
                            <div>
                                <h1 className="text-xl sm:text-2xl font-bold text-slate-900">รายงานวิเคราะห์ (อัปเดตสดจาก Google Docs)</h1>
                                <p className="text-xs text-slate-500 font-medium mt-0.5">🟢 ซิงค์เนื้อหาต้นฉบับอัตโนมัติผ่าน GitHub Actions</p>
                            </div>
                            <button onClick={onOpenQr} className="text-xs text-indigo-600 border border-indigo-600 rounded-xl px-3 py-1.5 font-medium">
                                <Icons.QrCode /> แชร์ QR
                            </button>
                        </div>
                        <CleanGoogleDocRenderer rawHtml={fetchedHtml} />
                    </div>
                );
            }

            const currentSlot = INITIAL_REPORT_SLOTS[0];
            return (
                <div className="fade-in space-y-6 sm:space-y-8 pb-10">
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 sm:p-8 text-center relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-blue-600 to-indigo-600"></div>
                        <h1 className="text-xl sm:text-2xl md:text-3xl font-bold text-slate-900 mb-2">{currentSlot.title}</h1>
                        <p className="text-xs sm:text-sm text-slate-500 font-medium">{currentSlot.subtitle}</p>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 sm:p-6 md:p-8">
                        <h2 className="text-lg sm:text-xl font-bold text-blue-800 mb-3 pb-2 border-b border-slate-100">{currentSlot.section1.title}</h2>
                        <ul className="space-y-2.5">
                            {currentSlot.section1.details.map((detail, idx) => (
                                <li key={idx} className="flex items-start text-xs sm:text-sm md:text-base leading-relaxed">
                                    <span className="text-blue-500 mr-2.5 mt-0.5 font-bold">•</span>
                                    <span className="text-slate-700">{detail}</span>
                                </li>
                            ))}
                        </ul>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('report');
            
            const [newsHtml, setNewsHtml] = useState(null);
            const [portfolioHtml, setPortfolioHtml] = useState(null);
            const [reportHtml, setReportHtml] = useState(null);

            const [isQrModalOpen, setIsQrModalOpen] = useState(false);

            useEffect(() => {
                // Fetch direct clean Google Docs HTML files synced by Workflow
                fetch('./doc_news.html')
                    .then(res => res.ok ? res.text() : null)
                    .then(html => { if (html && html.trim().length > 100) setNewsHtml(html); })
                    .catch(() => {});

                fetch('./doc_portfolio.html')
                    .then(res => res.ok ? res.text() : null)
                    .then(html => { if (html && html.trim().length > 100) setPortfolioHtml(html); })
                    .catch(() => {});

                fetch('./doc_report.html')
                    .then(res => res.ok ? res.text() : null)
                    .then(html => { if (html && html.trim().length > 100) setReportHtml(html); })
                    .catch(() => {});
            }, []);

            const navItems = [
                { id: 'news', label: 'ข่าวรายวัน', icon: Icons.News },
                { id: 'portfolio', label: 'สถานะพอร์ต', icon: Icons.Portfolio },
                { id: 'report', label: 'รายงานวิเคราะห์', icon: Icons.Report },
            ];

            const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=10&data=${encodeURIComponent(CURRENT_PAGE_URL)}`;

            return (
                <div className="min-h-screen flex flex-col lg:flex-row bg-slate-50">
                    {/* Sidebar Desktop */}
                    <aside className="hidden lg:flex flex-col w-64 bg-white border-r border-slate-200 fixed h-full z-20 shadow-xs">
                        <div className="p-6 flex items-center space-x-3">
                            <div className="w-10 h-10 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center shadow-sm">
                                <span className="text-white font-bold text-lg tracking-wider">AI</span>
                            </div>
                            <div>
                                <h1 className="text-lg font-bold text-slate-900 tracking-tight">InvestDash</h1>
                                <p className="text-[11px] text-slate-400 font-medium">ศูนย์ข้อมูลการลงทุน AI</p>
                            </div>
                        </div>
                        <nav className="flex-1 px-4 space-y-1.5 mt-2">
                            {navItems.map(item => {
                                const isActive = activeTab === item.id;
                                const Icon = item.icon;
                                return (
                                    <button
                                        key={item.id}
                                        onClick={() => setActiveTab(item.id)}
                                        className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all ${
                                            isActive 
                                            ? 'bg-blue-50 text-blue-700 font-semibold shadow-2xs' 
                                            : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                                        }`}
                                    >
                                        <Icon />
                                        <span className="text-sm">{item.label}</span>
                                    </button>
                                );
                            })}
                        </nav>

                        <div className="p-4 m-4 bg-indigo-50/70 rounded-xl border border-indigo-100 text-center">
                            <button 
                                onClick={() => setIsQrModalOpen(true)}
                                className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-xs py-2 px-3 rounded-lg flex items-center justify-center gap-1 shadow-xs"
                            >
                                <Icons.QrCode /> แชร์ QR Code
                            </button>
                        </div>
                    </aside>

                    {/* Mobile Top Header */}
                    <header className="lg:hidden sticky top-0 w-full bg-white/90 backdrop-blur-md border-b border-slate-200/80 z-30 pt-safe px-4 py-3">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center space-x-2.5">
                                <div className="w-8 h-8 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-lg flex items-center justify-center shadow-xs">
                                    <span className="text-white font-bold text-sm">AI</span>
                                </div>
                                <span className="text-base font-bold text-slate-900 tracking-tight">InvestDash</span>
                            </div>

                            <div className="hidden sm:flex bg-slate-100 p-1 rounded-xl">
                                {navItems.map(item => (
                                    <button
                                        key={item.id}
                                        onClick={() => setActiveTab(item.id)}
                                        className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                                            activeTab === item.id ? 'bg-white text-blue-600 shadow-2xs' : 'text-slate-600'
                                        }`}
                                    >
                                        {item.label}
                                    </button>
                                ))}
                            </div>

                            <button 
                                onClick={() => setIsQrModalOpen(true)}
                                className="sm:hidden text-xs bg-indigo-50 text-indigo-700 border border-indigo-200 px-2.5 py-1.5 rounded-lg font-medium flex items-center"
                            >
                                <Icons.QrCode /> QR
                            </button>
                        </div>
                    </header>

                    {/* Mobile Bottom Navigation */}
                    <nav className="sm:hidden fixed bottom-0 w-full bg-white/95 backdrop-blur-md border-t border-slate-200 z-40 flex justify-around pb-safe shadow-lg">
                        {navItems.map(item => {
                            const isActive = activeTab === item.id;
                            const Icon = item.icon;
                            return (
                                <button
                                    key={item.id}
                                    onClick={() => setActiveTab(item.id)}
                                    className={`flex flex-col items-center py-2 px-3 w-full transition-colors active:scale-95 ${
                                        isActive ? 'text-blue-600 font-semibold' : 'text-slate-400 hover:text-slate-600'
                                    }`}
                                >
                                    <Icon />
                                    <span className="text-[11px] mt-1">{item.label}</span>
                                </button>
                            );
                        })}
                    </nav>

                    {/* Main Content Area */}
                    <main className="flex-1 lg:ml-64 p-4 sm:p-6 md:p-8 pb-24 sm:pb-8">
                        {activeTab === 'news' && (
                            <NewsTab fetchedHtml={newsHtml} onOpenQr={() => setIsQrModalOpen(true)} />
                        )}
                        {activeTab === 'portfolio' && (
                            <PortfolioTab fetchedHtml={portfolioHtml} onOpenQr={() => setIsQrModalOpen(true)} />
                        )}
                        {activeTab === 'report' && (
                            <ReportTab fetchedHtml={reportHtml} onOpenQr={() => setIsQrModalOpen(true)} />
                        )}
                    </main>

                    {/* QR Code Modal */}
                    {isQrModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 fade-in">
                            <div className="bg-white rounded-2xl w-[92vw] sm:w-full max-w-sm p-6 shadow-2xl relative text-center border border-slate-100">
                                <button 
                                    onClick={() => setIsQrModalOpen(false)}
                                    className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1 rounded-lg"
                                >
                                    <Icons.Close />
                                </button>

                                <div className="w-12 h-12 bg-indigo-50 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-indigo-100">
                                    <Icons.QrCode />
                                </div>

                                <h3 className="text-lg font-bold text-slate-900 mb-1">สแกนเปิดบนมือถือ / iPad</h3>
                                <p className="text-xs text-slate-500 mb-4">
                                    ส่อง QR Code นี้ด้วยกล้องบน iPad หรือสมาร์ตโฟนเพื่อเปิดหน้ารายงานทันที
                                </p>

                                <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200/80 inline-block mb-4 shadow-inner">
                                    <img src={qrCodeUrl} alt="Dashboard QR Code" className="w-48 h-48 mx-auto rounded-lg" />
                                </div>

                                <div className="bg-indigo-50/70 p-3 rounded-xl border border-indigo-100 text-[11px] text-indigo-900 font-medium select-all break-all">
                                    {CURRENT_PAGE_URL}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
