        // --- DYNAMIC DATE PARSER & AUTOMATIC CHRONOLOGICAL SORTING SYSTEM ---

        const parseDateToTimestamp = (dateStr) => {
            if (!dateStr) return 0;
            
            const isoMatch = dateStr.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
            if (isoMatch) {
                return new Date(parseInt(isoMatch[1]), parseInt(isoMatch[2]) - 1, parseInt(isoMatch[3])).getTime();
            }

            const thaiMonths = {
                'มกราคม': 0, 'ม.ค.': 0,
                'กุมภาพันธ์': 1, 'ก.พ.': 1,
                'มีนาคม': 2, 'มี.ค.': 2,
                'เมษายน': 3, 'เม.ย.': 3,
                'พฤษภาคม': 4, 'พ.ค.': 4,
                'มิถุนายน': 5, 'มิ.ย.': 5,
                'กรกฎาคม': 6, 'ก.ค.': 6,
                'สิงหาคม': 7, 'ส.ค.': 7,
                'กันยายน': 8, 'ก.ย.': 8,
                'ตุลาคม': 9, 'ต.ค.': 9,
                'พฤศจิกายน': 10, 'พ.ย.': 10,
                'ธันวาคม': 11, 'ธ.ค.': 11
            };

            const thaiMatch = dateStr.match(/(\d{1,2})\s+([^\s\d]+)\s+(\d{4})/);
            if (thaiMatch) {
                const day = parseInt(thaiMatch[1]);
                const monthName = thaiMatch[2];
                let year = parseInt(thaiMatch[3]);
                if (year > 2400) year -= 543;
                const month = thaiMonths[monthName] !== undefined ? thaiMonths[monthName] : 0;
                return new Date(year, month, day).getTime();
            }

            const fallbackDate = Date.parse(dateStr);
            return isNaN(fallbackDate) ? 0 : fallbackDate;
        };

        const sortSlotsByDate = (slots) => {
            if (!slots || !Array.isArray(slots)) return [];
            return [...slots].sort((a, b) => {
                const timeA = parseDateToTimestamp(a.dateLabel || a.date);
                const timeB = parseDateToTimestamp(b.dateLabel || b.date);
                return timeB - timeA;

                            <h2 className="text-lg sm:text-xl font-bold text-blue-800 mb-5 pb-2 border-b border-slate-100">{currentSlot.section2.title}</h2>
                            <div className="overflow-x-auto -mx-5 sm:mx-0 px-5 sm:px-0">
                                <table className="w-full text-left border-collapse min-w-[540px]">
                                    <thead>
                                        <tr className="bg-slate-50 text-slate-600 text-xs sm:text-sm">
                                            <th className="p-3 sm:p-4 rounded-l-lg font-semibold">ตัวชี้วัดสำคัญ (Checkpoints)</th>
                                            <th className="p-3 sm:p-4 font-semibold w-28 sm:w-32">สถานะ</th>
                                            <th className="p-3 sm:p-4 rounded-r-lg font-semibold">สรุปผลการประเมิน</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {currentSlot.section2.checkpoints && currentSlot.section2.checkpoints.map((cp) => (
                                            <tr key={cp.id} className="border-b border-slate-50 hover:bg-slate-50/50 transition-colors">
                                                <td className="p-3 sm:p-4 text-xs sm:text-sm font-medium text-slate-800">{cp.id}. {cp.name}</td>
                                                <td className="p-3 sm:p-4">
                                                    <span className={`inline-block px-2.5 py-1 rounded-full text-[11px] font-semibold border ${getStatusColor(cp.status)}`}>
                                                        {cp.status}
                                                    </span>
                                                </td>
                                                <td className="p-3 sm:p-4 text-xs sm:text-sm text-slate-600 leading-relaxed">{cp.desc}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {currentSlot.section3 && (
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 sm:p-6 md:p-8">
                            <h2 className="text-lg sm:text-xl font-bold text-blue-800 mb-5 pb-2 border-b border-slate-100">{currentSlot.section3.title}</h2>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6">
                                {currentSlot.section3.picks && currentSlot.section3.picks.map((pick, idx) => (
                                    <div key={idx} className="bg-white rounded-2xl border border-slate-200 p-5 shadow-2xs hover:shadow-md transition-all relative overflow-hidden">
                                        <div className="absolute top-0 right-0 bg-blue-600 text-white font-bold text-[11px] px-3 py-1 rounded-bl-xl">
                                            #{idx + 1}
                                        </div>
                                        <div className="flex items-center space-x-3 mb-3 pt-1">
                                            <div className="w-11 h-11 rounded-xl bg-slate-100 flex items-center justify-center font-bold text-lg text-blue-800 border border-slate-200/80 shrink-0">
                                                {pick.ticker ? pick.ticker[0] : 'AI'}
                                            </div>
                                            <div>
                                                <h3 className="font-bold text-slate-900 text-sm sm:text-base">{pick.name}</h3>
                                                <p className="text-xs font-semibold text-slate-500">{pick.ticker}</p>
                                            </div>
                                        </div>
                                        <div className="mb-3">
                                            <span className="text-[11px] bg-indigo-50 text-indigo-700 border border-indigo-100 px-2.5 py-1 rounded-lg font-medium">{pick.phase}</span>
                                        </div>
                                        <p className="text-xs sm:text-sm text-slate-600 leading-relaxed">
                                            <span className="font-semibold text-slate-800">เหตุผล: </span>{pick.reason}
                                        </p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('report');
            
            const [newsSlots, setNewsSlots] = useState(INITIAL_NEWS_SLOTS);
            const [newsActiveIndex, setNewsActiveIndex] = useState(0);

            const [portfolioSlots, setPortfolioSlots] = useState(INITIAL_PORTFOLIO_SLOTS);
            const [portfolioActiveIndex, setPortfolioActiveIndex] = useState(0);

            const [reportSlots, setReportSlots] = useState(INITIAL_REPORT_SLOTS);
            const [reportActiveIndex, setReportActiveIndex] = useState(0);

            const [isHistoryDrawerOpen, setIsHistoryDrawerOpen] = useState(false);
            const [isQrModalOpen, setIsQrModalOpen] = useState(false);

            const navItems = [
                { id: 'news', label: 'ข่าวรายวัน', icon: Icons.News },
                { id: 'portfolio', label: 'สถานะพอร์ต', icon: Icons.Portfolio },
                { id: 'report', label: 'รายงานวิเคราะห์', icon: Icons.Report },
            ];

            const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=10&data=${encodeURIComponent(CURRENT_PAGE_URL)}`;

            const getActiveDrawerProps = () => {
                if (activeTab === 'news') {
                    return {
                        slots: newsSlots,
                        activeSlotIndex: newsActiveIndex,
                        setActiveSlotIndex: setNewsActiveIndex,
                        categoryTitle: "ข่าวรายวัน"
                    };
                }
                if (activeTab === 'portfolio') {
                    return {
                        slots: portfolioSlots,
                        activeSlotIndex: portfolioActiveIndex,
                        setActiveSlotIndex: setPortfolioActiveIndex,
                        categoryTitle: "สถานะพอร์ต"
                    };
                }
                return {
                    slots: reportSlots,
                    activeSlotIndex: reportActiveIndex,
                    setActiveSlotIndex: setReportActiveIndex,
                    categoryTitle: "รายงานวิเคราะห์"
                };
            };

            const drawerProps = getActiveDrawerProps();
            const activeSortedSlots = sortSlotsByDate(drawerProps.slots);

            return (
                <div className="min-h-screen flex flex-col lg:flex-row bg-slate-50">
                    {/* Sidebar Desktop */}
                    <aside className="hidden lg:flex flex-col w-64 bg-white border-r border-slate-200 fixed h-full z-20 shadow-xs">
                        <div className="p-6 flex items-center space-x-3">
                            <div className="w-10 h-10 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center shadow-sm">
                                <span className="text-white font-bold text-lg tracking-wider">AI</span>
                            </div>
                            <div>
                                <h1 className="text-lg font-bold text-slate-900 tracking-tight">InvestDash</h1>
                                <p className="text-[11px] text-slate-400 font-medium">ศูนย์ข้อมูลการลงทุน AI</p>
                            </div>
                        </div>
                        <nav className="flex-1 px-4 space-y-1.5 mt-2">
                            {navItems.map(item => {
                                const isActive = activeTab === item.id;
                                const Icon = item.icon;
                                return (
                                    <button
                                        key={item.id}
                                        onClick={() => setActiveTab(item.id)}
                                        className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all ${
                                            isActive 
                                            ? 'bg-blue-50 text-blue-700 font-semibold shadow-2xs' 
                                            : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                                        }`}
                                    >
                                        <Icon />
                                        <span className="text-sm">{item.label}</span>
                                    </button>
                                );
                            })}
                        </nav>

                        <div className="p-4 mx-4 mb-2 bg-slate-50 rounded-xl border border-slate-200 text-left">
                            <span className="text-[11px] font-semibold text-slate-500 block mb-1">📜 เลือกดูรายงานย้อนหลัง:</span>
                            <button 
                                onClick={() => setIsHistoryDrawerOpen(true)}
                                className="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-xs font-bold text-indigo-700 hover:bg-indigo-50 flex items-center justify-between transition-all"
                            >
                                <span>{activeSortedSlots[drawerProps.activeSlotIndex]?.dateLabel || 'ฉบับปัจจุบัน'}</span>
                                <span className="text-[10px] bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded-md">เปิดคลังรายงาน</span>
                            </button>
                        </div>

                        <div className="p-4 m-4 bg-indigo-50/70 rounded-xl border border-indigo-100 text-center">
                            <button 
                                onClick={() => setIsQrModalOpen(true)}
                                className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-xs py-2 px-3 rounded-lg flex items-center justify-center gap-1 shadow-xs"
                            >
                                <Icons.QrCode /> แชร์ QR Code
                            </button>
                        </div>
                    </aside>

                    {/* Mobile / Tablet Top Header */}
                    <header className="lg:hidden sticky top-0 w-full bg-white/90 backdrop-blur-md border-b border-slate-200/80 z-30 pt-safe px-4 py-3">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center space-x-2.5">
                                <div className="w-8 h-8 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-lg flex items-center justify-center shadow-xs">
                                    <span className="text-white font-bold text-sm">AI</span>
                                </div>
                                <span className="text-base font-bold text-slate-900 tracking-tight">InvestDash</span>
                            </div>

                            <div className="hidden sm:flex bg-slate-100 p-1 rounded-xl">
                                {navItems.map(item => (
                                    <button
                                        key={item.id}
                                        onClick={() => setActiveTab(item.id)}
                                        className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                                            activeTab === item.id ? 'bg-white text-blue-600 shadow-2xs' : 'text-slate-600'
                                        }`}
                                    >
                                        {item.label}
                                    </button>
                                ))}
                            </div>

                            <button 
                                onClick={() => setIsQrModalOpen(true)}
                                className="sm:hidden text-xs bg-indigo-50 text-indigo-700 border border-indigo-200 px-2.5 py-1.5 rounded-lg font-medium flex items-center"
                            >
                                <Icons.QrCode /> QR
                            </button>
                        </div>
                    </header>

                    {/* Mobile Bottom Navigation */}
                    <nav className="sm:hidden fixed bottom-0 w-full bg-white/95 backdrop-blur-md border-t border-slate-200 z-40 flex justify-around pb-safe shadow-lg">
                        {navItems.map(item => {
                            const isActive = activeTab === item.id;
                            const Icon = item.icon;
                            return (
                                <button
                                    key={item.id}
                                    onClick={() => setActiveTab(item.id)}
                                    className={`flex flex-col items-center py-2 px-3 w-full transition-colors active:scale-95 ${
                                        isActive ? 'text-blue-600 font-semibold' : 'text-slate-400 hover:text-slate-600'
                                    }`}
                                >
                                    <Icon />
                                    <span className="text-[11px] mt-1">{item.label}</span>
                                </button>
                            );
                        })}
                    </nav>

                    {/* Main Content Area */}
                    <main className="flex-1 lg:ml-64 p-4 sm:p-6 md:p-8 pb-24 sm:pb-8">
                        {activeTab === 'news' && (
                            <NewsTab 
                                slots={newsSlots}
                                activeSlotIndex={newsActiveIndex}
                                setActiveSlotIndex={setNewsActiveIndex}
                                onOpenQr={() => setIsQrModalOpen(true)} 
                                onOpenHistoryDrawer={() => setIsHistoryDrawerOpen(true)}
                            />
                        )}
                        {activeTab === 'portfolio' && (
                            <PortfolioTab 
                                slots={portfolioSlots}
                                activeSlotIndex={portfolioActiveIndex}
                                setActiveSlotIndex={setPortfolioActiveIndex}
                                onOpenQr={() => setIsQrModalOpen(true)} 
                                onOpenHistoryDrawer={() => setIsHistoryDrawerOpen(true)}
                            />
                        )}
                        {activeTab === 'report' && (
                            <ReportTab 
                                slots={reportSlots}
                                activeSlotIndex={reportActiveIndex}
                                setActiveSlotIndex={setReportActiveIndex}
                                onOpenQr={() => setIsQrModalOpen(true)} 
                                onOpenHistoryDrawer={() => setIsHistoryDrawerOpen(true)}
                            />
                        )}
                    </main>

                    {/* Collapsible History Drawer / Popover for Category Slots */}
                    <HistoryDrawerPopup 
                        slots={drawerProps.slots}
                        activeSlotIndex={drawerProps.activeSlotIndex}
                        setActiveSlotIndex={drawerProps.setActiveSlotIndex}
                        isOpen={isHistoryDrawerOpen}
                        setIsOpen={setIsHistoryDrawerOpen}
                        categoryTitle={drawerProps.categoryTitle}
                    />

                    {/* QR Code Modal */}
                    {isQrModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 fade-in">
                            <div className="bg-white rounded-2xl w-[92vw] sm:w-full max-w-sm p-6 shadow-2xl relative text-center border border-slate-100">
                                <button 
                                    onClick={() => setIsQrModalOpen(false)}
                                    className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1 rounded-lg"
                                >
                                    <Icons.Close />
                                </button>

                                <div className="w-12 h-12 bg-indigo-50 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-indigo-100">
                                    <Icons.QrCode />
                                </div>

                                <h3 className="text-lg font-bold text-slate-900 mb-1">สแกนเปิดบนมือถือ / iPad</h3>
                                <p className="text-xs text-slate-500 mb-4">
                                    ส่อง QR Code นี้ด้วยกล้องบน iPad หรือสมาร์ตโฟนเพื่อเปิดหน้ารายงานทันที
                                </p>

                                <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200/80 inline-block mb-4 shadow-inner">
                                    <img src={qrCodeUrl} alt="Dashboard QR Code" className="w-48 h-48 mx-auto rounded-lg" />
                                </div>

                                <div className="bg-indigo-50/70 p-3 rounded-xl border border-indigo-100 text-[11px] text-indigo-900 font-medium select-all break-all">
                                    {CURRENT_PAGE_URL}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
