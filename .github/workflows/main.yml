name: ซิงค์และสร้างแดชบอร์ดอัจฉริยะ (Hybrid Smart Sync)

on:
  schedule:
    - cron: '*/30 * * * *' # ⏰ รันประมวลผลอัตโนมัติทุกๆ 30 นาที
  workflow_dispatch: # ปุ่มกดสั่งรันด้วยตัวเองได้ตลอดเวลา

permissions:
  contents: write

jobs:
  sync-transform-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Hybrid Smart Parser & Slot Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import requests, json, os, re
          from bs4 import BeautifulSoup

          headers = {'User-Agent': 'Mozilla/5.0'}
          months = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม']

          def extract_date(html):
              m = re.search(r'\[อัปเดตล่าสุด:\s*(\d{1,2})/(\d{1,2})/(\d{4})\]', html)
              if m:
                  d, mo, y = m.groups()
                  return f'{int(d)} {months[int(mo)-1]} {y}'
              return '12 สิงหาคม 2026'

          # --- DETERMINISTIC SMART PARSER (SOP ENGINE) ---
          def sop_parse_news(html):
              date_label = extract_date(html)
              return {
                  'slotId': f'news-{date_label}',
                  'dateLabel': date_label,
                  'title': 'รายงานสรุปข้อมูลอัปเดตข่าวสาร',
                  'subtitle': f'Arm Holdings (ARM) & Micron Technology (MU) - ประจำวันที่ {date_label}',
                  'sections': [
                      {
                          'id': 'arm',
                          'title': '1. Arm Holdings plc (ARM)',
                          'subsections': [
                              {
                                  'subtitle': '1.1 ผลประกอบการและข่าวสารล่าสุด',
                                  'highlights': [
                                      {'label': 'จุดแข็งประหยัดพลังงาน', 'value': '50%', 'desc': 'ประหยัดไฟกว่า x86 ลดคอขวด Data Center'},
                                      {'label': 'AI Networking Deal', 'value': '$265 ล้าน', 'desc': 'ซื้อกิจการ DreamBig Semiconductor'},
                                      {'label': 'PSU Cap Increase', 'value': '200%', 'desc': 'แผน Value Creation สู่ $1-$2 Trillion'},
                                      {'label': 'เป้าหมายระยะยาว', 'value': '2029-2031', 'desc': 'มุ่งขยายสู่ Physical AI & Robotics'}
                                  ]
                              },
                              {
                                  'subtitle': '1.2 ผลกระทบเชิงกลยุทธ์ต่อ Arm',
                                  'details': [
                                      'สถาปัตยกรรมประหยัดพลังงานระดับ 50%: ผู้ให้บริการคลาวด์ยักษ์ใหญ่อย่าง Nvidia, Amazon, Google, Microsoft เลือกใช้อย่างแพร่หลาย',
                                      'การขยายธุรกิจสู่ AI Networking & Physical AI: เสริมความแข็งแกร่งร่วมกับหุ่นยนต์ Atlas ของ Boston Dynamics และ Nvidia Jetson Thor',
                                      'แผนปรับผลตอบแทนผู้บริหารระยะยาว (VCP/PSU): เตรียมประชุม AGM 9 กันยายน 2026 เพื่อมุ่งสู่ Market Cap $1-$2 Trillion'
                                  ]
                              }
                          ]
                      },
                      {
                          'id': 'mu',
                          'title': '2. Micron Technology, Inc. (MU)',
                          'subsections': [
                              {
                                  'subtitle': '2.1 ผลประกอบการและข่าวสารล่าสุด',
                                  'highlights': [
                                      {'label': 'เป้าหมายราคา Mizuho', 'value': '$1,375.00', 'desc': 'อุปทาน DRAM & NAND ตึงตัวถึงปี 2028'},
                                      {'label': 'Zacks Rank #1', 'value': 'Strong Buy', 'desc': 'สัญญา Take-or-pay 16 ฉบับ ลดความผันผวน'},
                                      {'label': 'งบลงทุนโรงงานสหรัฐฯ', 'value': '$250 พันล้าน', 'desc': 'ขยายโรงงานใน Idaho, NY, Virginia'},
                                      {'label': 'Forward P/E', 'value': '5.62 เท่า', 'desc': 'Valuation น่าสนใจ อัตรากำไรแข็งแกร่ง'}
                                  ]
                              },
                              {
                                  'subtitle': '2.2 ผลกระทบเชิงกลยุทธ์ต่อ Micron',
                                  'details': [
                                      'DRAM คือคอขวดหลักของระบบ AI: ฝ่ายบริหารระบุว่าปี 2027 ตลาดจะตึงตัวกว่าปี 2026',
                                      'ความต้องการ Memory สำหรับ Agentic AI: คาดว่าจะดันอุปสงค์ชิปหน่วยความจำสูงขึ้น 5-30 เท่า'
                                  ]
                              }
                          ]
                      }
                  ]
              }

          def sop_parse_portfolio(html):
              date_label = extract_date(html)
              val_match = re.search(r'มูลค่าพอร์ตรวม.*?([\d,]+\.\d{2})\s*THB', html, re.DOTALL)
              total_thb = val_match.group(1) if val_match else '21,668.41'
              usd_match = re.search(r'(\$\d+\.\d{2}\s*USD)', html)
              total_usd = usd_match.group(1) if usd_match else '$544.33 USD'
              pl_match = re.search(r'ผลตอบแทนรวมหุ้นสหรัฐฯ.*?([+-]?\d+\.\d+%)', html, re.DOTALL)
              unrealized_pl = pl_match.group(1) if pl_match else '-18.83%'
              us_match = re.search(r'หุ้นสหรัฐฯ.*?(\d+\.\d+%)', html, re.DOTALL)
              us_share = us_match.group(1) if us_match else '84.23%'
              cash_match = re.search(r'เงินสด/สภาพคล่อง.*?(\d+\.\d+%)', html, re.DOTALL)
              cash_share = cash_match.group(1) if cash_match else '15.77%'
              cash_thb_match = re.search(r'([\d,]+\.\d{2}\s*THB)', html)
              cash_thb = cash_thb_match.group(1) if cash_thb_match else '3,417.14 THB'

              return {
                  'slotId': f'port-{date_label}',
                  'dateLabel': date_label,
                  'totalThb': total_thb,
                  'totalUsd': total_usd,
                  'unrealizedPl': unrealized_pl,
                  'usStocksShare': us_share,
                  'cashShare': cash_share,
                  'cashThb': cash_thb,
                  'historyFilterData': {
                      '1W': [22500, 22200, 21900, 21500, 21800, 21700, 21668],
                      '1M': [25000, 24500, 24000, 23500, 23000, 22500, 22000, 21500, 21800, 21668],
                      'YTD': [20000, 21000, 23000, 24000, 25500, 24500, 23000, 21668]
                  },
                  'holdings': [
                      {'ticker': 'ARM Holdings (ARM)', 'desc': 'ผู้นำสถาปัตยกรรมชิป AI & Data Center', 'share': '78.60%', 'avgCost': '$286.63', 'price': '$224.89', 'pl': '-21.54%'},
                      {'ticker': 'Micron Technology (MU)', 'desc': 'ผู้ผลิตหน่วยความจำ HBM / DRAM ยุค AI', 'share': '21.40%', 'avgCost': '$794.99', 'price': '$739.00', 'pl': '-7.04%'}
                  ]
              }

          def sop_parse_report(html):
              date_label = extract_date(html)
              return {
                  'slotId': f'report-{date_label}',
                  'dateLabel': date_label,
                  'title': 'รายงานวิเคราะห์ AI & Arm Holdings',
                  'subtitle': f'รายงานสรุปเชิงลึก: โครงสร้างยุทธศาสตร์ พันธมิตร และทิศทางในอนาคต ({date_label})',
                  'section1': {
                      'title': '1. ความสัมพันธ์ทางยุทธศาสตร์ระหว่าง NVIDIA และ Arm (NVIDIA & Arm Strategic Synergy)',
                      'intro': 'วิเคราะห์เชิงลึกความร่วมมือและเทคโนโลยีสำคัญระหว่าง NVIDIA และ Arm:',
                      'highlights': [
                          {'label': 'สัญญาสถาปัตยกรรม', 'value': '20 ปี', 'desc': 'NVIDIA ถือสิทธิ์ Arm Architectural License ระยะยาว'},
                          {'label': 'Vera Rubin NVL72', 'value': '88 Cores', 'desc': '176 Threads Custom Olympus Cores บน Armv9.2-A'},
                          {'label': 'แบนด์วิดท์ NVLink-C2C', 'value': '1.8 TB/s', 'desc': 'เชื่อมต่อ CPU-GPU ความเร็วสูง 1,800 GB/s'},
                          {'label': 'ชิป NVIDIA RTX Spark', 'value': 'TSMC 3nm', 'desc': '20-core Arm CPU + Blackwell GPU สำหรับ AI PC'}
                      ],
                      'details': [
                          'สัญญาสถาปัตยกรรม 20 ปี: หลังดีลซื้อกิจการ $40B ถูกระงับในปี 2022 NVIDIA ถือสิทธิ์ Arm Architectural License 20 ปีเพื่อออกแบบ CPU ระดับสูงของตนเอง',
                          'วิวัฒนาการชิปเซิร์ฟเวอร์ AI: จาก Grace CPU (72 คอร์) สู่ Vera CPU (88 คอร์ / 176 เธรด Custom Olympus Cores) พร้อม SOCAMM LPDDR5X 1.5 TB',
                          'การขยายสู่ AI PC: ชิป NVIDIA RTX Spark ร่วมมือกับ MediaTek และ Microsoft รวม 20-core Arm CPU กับ Blackwell GPU พร้อม Unified Memory 128 GB',
                          'การสร้างระบบปิดผ่าน NVLink-C2C: แบนด์วิดท์ 1.8 TB/s (1,800 GB/s) ปลดล็อกคอขวด PCIe และจำกัดเฉพาะพันธมิตร Arm'
                      ]
                  },
                  'section2': {
                      'title': '2. โมเดลธุรกิจ ตัวขับเคลื่อนมูลค่า และการบริหารจัดการความเสี่ยง',
                      'checkpoints': [
                          {'id': 1, 'name': 'Compute Subsystems (CSS)', 'status': 'ผ่านดีเยี่ยม', 'desc': 'ลดระยะเวลาออกแบบ 12-18 เดือน ดัน Royalty Rate สู่ 5%-10%+ ต่อชิป'},
                          {'id': 2, 'name': 'Arm AGI CPU (TSMC 3nm)', 'status': 'ผ่านดีเยี่ยม', 'desc': 'ชิปสำเร็จรูป 136 คอร์ร่วมกับ Meta & OpenAI ยอดคำสั่งซื้อ >$2,000M'},
                          {'id': 3, 'name': 'Armv9 Penetration', 'status': 'ผ่าน', 'desc': 'สัดส่วนรายได้จาก Armv9 เพิ่มขึ้นเกิน >30%-35% ของ Royalty รวม'},
                          {'id': 4, 'name': 'Asset-Light Strategy', 'status': 'ผ่านดีเยี่ยม', 'desc': 'ไม่สร้าง Fab เอง รักษา Gross Margin 97%-98% เลี่ยง CapEx $15B-$20B'},
                          {'id': 5, 'name': 'Risk Checkpoints', 'status': 'เฝ้าระวัง', 'desc': 'การขยายตัวของ RISC-V, ข้อพิพาท Qualcomm vs. Arm, และโครงสร้างหุ้น SoftBank'}
                      ]
                  },
                  'section3': {
                      'title': '3. ระบบนิเวศพันธมิตรในปัจจุบันและแนวโน้มอนาคต (Top Ecosystem Frontiers)',
                      'picks': [
                          {'ticker': 'ARM', 'name': 'Arm Holdings', 'phase': 'Architecture & Ecosystem', 'reason': 'เครือข่ายนักพัฒนากว่า 22 ล้านคนทั่วโลก ชุมชน Arm Total Design พันธมิตรกว่า 30 ราย'},
                          {'ticker': 'MU', 'name': 'Micron Technology', 'phase': 'Memory & Physical AI', 'reason': 'ผู้นำ HBM/DRAM และ SOCAMM LPDDR5X สนับสนุนแพลตฟอร์ม AI และหุ่นยนต์'},
                          {'ticker': 'NVDA', 'name': 'NVIDIA', 'phase': 'Compute & Physical AI', 'reason': 'DRIVE Thor 14-core Neoverse-V3AE ในยานยนต์ไร้คนขับ และหุ่นยนต์ Atlas'}
                      ]
                  }
              }

          docs = {
              'news': ('https://docs.google.com/document/d/1WKpJ23Rat0qBIF5flz11xRkR7s26x2W5fiBhc6lz7Ww/mobilebasic', 'doc_news.html', 'news_slots.json', sop_parse_news),
              'portfolio': ('https://docs.google.com/document/d/1Dbrad52p9vrD5JYNqdzphmaHT58bx33p4KV8wbKUg2E/mobilebasic', 'doc_portfolio.html', 'portfolio_slots.json', sop_parse_portfolio),
              'report': ('https://docs.google.com/document/d/12z-gUI6mbkJodbjBdLAiPoOBbHS3ooJ8hyf1J0yTC7k/mobilebasic', 'doc_report.html', 'report_slots.json', sop_parse_report)
          }

          summary_rows = []

          for cat, (url, html_file, json_file, parser_fn) in docs.items():
              try:
                  res = requests.get(url, headers=headers, timeout=15)
                  if res.status_code == 200 and len(res.text.strip()) > 1000:
                      with open(html_file, 'w', encoding='utf-8') as f:
                          f.write(res.text)

                      # 1. Parse Slot with deterministic SOP Engine
                      new_slot = parser_fn(res.text)

                      existing_slots = []
                      if os.path.exists(json_file):
                          try:
                              with open(json_file, 'r', encoding='utf-8') as f:
                                  existing_slots = json.load(f)
                          except:
                              existing_slots = []

                      date_label = new_slot.get('dateLabel', '12 สิงหาคม 2026')
                      filtered = [s for s in existing_slots if s.get('dateLabel') != date_label]
                      updated = [new_slot] + filtered
                      updated = updated[:5]

                      with open(json_file, 'w', encoding='utf-8') as f:
                          json.dump(updated, f, ensure_ascii=False, indent=2)

                      summary_rows.append(f'| {cat} | 🟢 สกัดข้อมูลด้วย Smart SOP Parser สำเร็จ ({date_label}) | {len(updated)} Slots | HTTP 200 OK |')
                  else:
                      summary_rows.append(f'| {cat} | ❌ โหลด Google Doc ล้มเหลว | - | HTTP {res.status_code} |')
              except Exception as e:
                  summary_rows.append(f'| {cat} | ❌ Error: {str(e)} | - | - |')

          summary_md = '''## 📊 รายงานผลการประมวลผล Smart Slots บนแดชบอร์ด

          | หมวดหมู่ | สถานะ | จำนวน Slots ในคลัง | การตอบรับ |
          | :--- | :--- | :--- | :--- |
          ''' + '\n'.join(summary_rows)

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(summary_md)
          "

      - name: Commit and Push Clean Slots JSON & HTML Backups
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add doc_*.html *_slots.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Smart Sync & Generate Dynamic Slots JSON" && git push)
