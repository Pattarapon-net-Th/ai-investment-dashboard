name: Sync 3 Google Docs to Dashboard

on:
  schedule:
    - cron: '0 * * * *' # รันดึงข้อมูลทั้ง 3 เอกสารอัตโนมัติทุกๆ 1 ชั่วโมง
  workflow_dispatch: # ปุ่มกดสั่งรันอัปเดตทันทีด้วยมือ (Manual Run)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Fetch 3 Google Docs
        run: |
          python -c "
          import urllib.request
          
          # ลิงก์ เผยแพร่ไปยังเว็บ (Publish to web) ของเอกสารทั้ง 3 ไฟล์
          docs = {
              'doc_news.html': 'ใส่อิสระ_LINK_PUBLISH_ของเอกสารอัปเดตข่าวสาร',
              'doc_portfolio.html': 'ใส่อิสระ_LINK_PUBLISH_ของเอกสารสรุปสถานะพอร์ต',
              'doc_report.html': 'ใส่อิสระ_LINK_PUBLISH_ของเอกสารรายงานวิเคราะห์'
          }
          
          for filename, url in docs.items():
              try:
                  urllib.request.urlretrieve(url, filename)
                  print(f'ดาวน์โหลด {filename} สำเร็จ!')
              except Exception as e:
                  print(f'เกิดข้อผิดพลาดกับ {filename}:', e)
          "

      - name: Commit and Push to GitHub Pages
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Auto-sync 3 Google Docs to Dashboard slots" || exit 0
          git push
