name: Sync 3 Google Docs to Dashboard

on:
  schedule:
    - cron: '0 * * * *' # รันอัตโนมัติทุกๆ 1 ชั่วโมง
  workflow_dispatch: # ปุ่มกดสั่งรันด้วยมือ (Manual Run)

# เปิดสิทธิ์ให้ GitHub Actions มีสิทธิ์เซฟ Commit & Push ได้ (แก้ Error 403)
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Fetch 3 Google Docs
        run: |
          python -c "
          import urllib.request
          
          docs = {
              'doc_news.html': 'https://docs.google.com/document/d/e/2PACX-1vSNdyDFbJVZpfIA0act_QHOPpIJmM98IDkywKi4ft_O0nqXUp_cnjz0qVFKrL1E1ndN6DVh1CWwALT/pub',
              'doc_portfolio.html': 'https://docs.google.com/document/d/e/2PACX-1vThZMexqCf6uYyqhPC9I8J4zuz7ij2WDFRKCSpE00lhf8JYSYAhD54YL7LgS4CvdcYi7nhR6b_GQUOm/pub',
              'doc_report.html': 'https://docs.google.com/document/d/e/2PACX-1vRYT9on5s3jamgd9F6VwrFDMJyekN0fS5zjdJEctToI889hoZPXj4-EZX4T3MNENn8c1ZrHDFJGGmH/pub'
          }
          
          for filename, url in docs.items():
              try:
                  urllib.request.urlretrieve(url, filename)
                  print(f'ดาวน์โหลด {filename} สำเร็จ!')
              except Exception as e:
                  print(f'เกิดข้อผิดพลาดกับ {filename}:', e)
          "

      - name: Commit and Push to GitHub Pages
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Auto-sync 3 Google Docs to Dashboard slots" || exit 0
          git push
