name: ซิงค์ประมวลผลและสร้าง Slot ข้อมูลอัตโนมัติ

on:
  schedule:
    - cron: '*/30 * * * *' # ⏰ รันประมวลผลอัตโนมัติทุกๆ 30 นาที
  workflow_dispatch: # ปุ่มกดสั่งรันด้วยตัวเองได้ตลอดเวลา

permissions:
  contents: write

jobs:
  sync-transform-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch and Transform Google Docs to Dynamic Slots JSON
        run: |
          python -c "
          import requests, json, os, re
          from bs4 import BeautifulSoup

          urls = {
              'news': ('doc_news.html', 'news_slots.json', 'https://docs.google.com/document/d/1WKpJ23Rat0qBIF5flz11xRkR7s26x2W5fiBhc6lz7Ww/mobilebasic'),
              'portfolio': ('doc_portfolio.html', 'portfolio_slots.json', 'https://docs.google.com/document/d/1Dbrad52p9vrD5JYNqdzphmaHT58bx33p4KV8wbKUg2E/mobilebasic'),
              'report': ('doc_report.html', 'report_slots.json', 'https://docs.google.com/document/d/12z-gUI6mbkJodbjBdLAiPoOBbHS3ooJ8hyf1J0yTC7k/mobilebasic')
          }

          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
          summary_rows = []

          def extract_date(text):
              match = re.search(r'(\d{1,2}\s+[^\s\d]+\s+\d{4})', text)
              if match:
                  return match.group(1)
              return '12 สิงหาคม 2026'

          for cat, (html_file, json_file, url) in urls.items():
              try:
                  res = requests.get(url, headers=headers, timeout=15)
                  if res.status_code == 200:
                      html_content = res.text
                      with open(html_file, 'w', encoding='utf-8') as f:
                          f.write(html_content)

                      soup = BeautifulSoup(html_content, 'html.parser')
                      text_content = soup.get_text(separator=' ')
                      date_label = extract_date(text_content)

                      # โหลดประวัติ Slots เดิมที่มีอยู่
                      existing_slots = []
                      if os.path.exists(json_file):
                          try:
                              with open(json_file, 'r', encoding='utf-8') as f:
                                  existing_slots = json.load(f)
                          except:
                              existing_slots = []

                      # ตรวจสอบและอัปเดต Slot ล่าสุด
                      slot_id = f'{cat}-{date_label}'
                      new_slot = {
                          'slotId': slot_id,
                          'dateLabel': date_label,
                          'title': f'รายงานสรุปข้อมูลอัปเดต{cat.capitalize()}',
                          'subtitle': f'ข้อมูลอัปเดตล่าสุดประจำวันที่ {date_label}',
                          'rawContent': text_content[:500]
                      }

                      # ป้องกันการบันทึก Slot ซ้ำวัน และจำกัดสูงสุด 5 Slots (Auto-Pruning)
                      filtered_slots = [s for s in existing_slots if s.get('dateLabel') != date_label]
                      updated_slots = [new_slot] + filtered_slots
                      updated_slots = updated_slots[:5]

                      with open(json_file, 'w', encoding='utf-8') as f:
                          json.dump(updated_slots, f, ensure_ascii=False, indent=2)

                      summary_rows.append(f'| {cat} | 🟢 สร้าง Slot สำเร็จ ({date_label}) | {len(updated_slots)} Slots | HTTP 200 OK |')
                  else:
                      summary_rows.append(f'| {cat} | ❌ อ่านข้อมูลล้มเหลว | - | HTTP {res.status_code} |')
              except Exception as e:
                  summary_rows.append(f'| {cat} | ❌ Error: {str(e)} | - | - |')

          summary_md = '''## 📊 รายงานการสร้าง Dynamic Slots อัตโนมัติ

          | หมวดหมู่ | สถานะการสร้าง Slot | จำนวน Slots ในคลัง | การตอบรับ Google Docs |
          | :--- | :--- | :--- | :--- |
          ''' + '\n'.join(summary_rows)

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(summary_md)
          "

      - name: Commit and Push Updated Slots JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add doc_*.html *_slots.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Generate & Sync Dynamic Slots JSON" && git push)
