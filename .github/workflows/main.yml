name: ซิงค์ข้อมูล Google Docs ไปยังแดชบอร์ดอัตโนมัติ

on:
  schedule:
    - cron: '*/30 * * * *' # ⏰ รันประมวลผลอัตโนมัติทุกๆ 30 นาที
  workflow_dispatch: # ปุ่มกดสั่งรันด้วยตัวเองได้ตลอดเวลา

permissions:
  contents: write

jobs:
  sync-google-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch Clean Google Docs HTML Content
        run: |
          python -c "
          import requests, os

          urls = {
              'ข่าวรายวัน (News)': ('doc_news.html', 'https://docs.google.com/document/d/1WKpJ23Rat0qBIF5flz11xRkR7s26x2W5fiBhc6lz7Ww/mobilebasic'),
              'สถานะพอร์ต (Portfolio)': ('doc_portfolio.html', 'https://docs.google.com/document/d/1Dbrad52p9vrD5JYNqdzphmaHT58bx33p4KV8wbKUg2E/mobilebasic'),
              'รายงานวิเคราะห์ (Report)': ('doc_report.html', 'https://docs.google.com/document/d/12z-gUI6mbkJodbjBdLAiPoOBbHS3ooJ8hyf1J0yTC7k/mobilebasic')
          }

          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
          summary_rows = []

          for category, (filename, url) in urls.items():
              try:
                  res = requests.get(url, headers=headers, timeout=15)
                  if res.status_code == 200 and len(res.text.strip()) > 0:
                      new_content = res.text
                      
                      with open(filename, 'w', encoding='utf-8') as f:
                          f.write(new_content)

                      size_kb = f'{len(new_content) / 1024:.1f} KB'
                      summary_rows.append(f'| {category} | 🟢 ดึงข้อมูลต้นฉบับสำเร็จ | {size_kb} | HTTP 200 OK |')
                  else:
                      summary_rows.append(f'| {category} | ❌ อ่านข้อมูลล้มเหลว | - | HTTP {res.status_code} |')
              except Exception as e:
                  summary_rows.append(f'| {category} | ❌ Error: {str(e)} | - | - |')

          summary_md = '''## 📊 รายงานผลการซิงค์ข้อมูล Google Docs ต้นฉบับ

          | หมวดหมู่ | สถานะ | ขนาดไฟล์ HTML | การตอบรับจาก Google Docs |
          | :--- | :--- | :--- | :--- |
          ''' + '\n'.join(summary_rows)

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(summary_md)
          "

      - name: Commit and Push Clean Google Docs HTML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add doc_*.html || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Sync clean Google Docs HTML content" && git push)
