name: ซิงค์และสร้างแดชบอร์ดอัจฉริยะ (SOP Clean Sync)

on:
  schedule:
    - cron: '*/30 * * * *' # ⏰ รันประมวลผลอัตโนมัติทุกๆ 30 นาที
  workflow_dispatch: # ปุ่มกดสั่งรันด้วยตัวเองได้ตลอดเวลา

permissions:
  contents: write

jobs:
  sync-transform-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Clean Parser & Dynamic Slot Sync
        run: |
          python -c "
          import requests, json, os, re
          from bs4 import BeautifulSoup

          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
          months = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม']

          def get_date(text):
              m = re.search(r'\[อัปเดตล่าสุด:\s*(\d{1,2})/(\d{1,2})/(\d{4})\]', text)
              if m:
                  d, mo, y = m.groups()
                  return f'{int(d)} {months[int(mo)-1]} {y}'
              return '12 สิงหาคม 2026'

          # 1. PARSE NEWS
          def parse_news(html):
              date_label = get_date(html)
              return {
                  'slotId': f'news-{date_label}',
                  'dateLabel': date_label,
                  'title': 'รายงานสรุปข้อมูลอัปเดตข่าวสาร',
                  'subtitle': f'Arm Holdings (ARM) & Micron Technology (MU) - ประจำวันที่ {date_label}',
                  'sections': [
                      {
                          'id': 'arm',
                          'title': '1. Arm Holdings plc (ARM)',
                          'subsections': [
                              {
                                  'subtitle': '1.1 ผลประกอบการและข่าวสารล่าสุด',
                                  'highlights': [
                                      {'label': 'รายได้รวม (Q1 FY27)', 'value': '$1.29 พันล้าน', 'desc': '(+22% YoY) ทำสถิติสูงสุดใหม่'},
                                      {'label': 'กำไรต่อหุ้น (Non-GAAP)', 'value': '$0.45', 'desc': 'สูงกว่าเป้าหมายของบริษัท'},
                                      {'label': 'Royalty Revenue', 'value': '$715 ล้าน', 'desc': '(+22% YoY) Data Center โต >100%'},
                                      {'label': 'ความต้องการ AGI CPU', 'value': '> $2 พันล้าน', 'desc': 'ยอดสั่งซื้อและโซลูชันทะลุเป้า'}
                                  ]
                              },
                              {
                                  'subtitle': '1.2 ผลกระทบเชิงกลยุทธ์ต่อ Arm',
                                  'details': [
                                      'การเปลี่ยนผ่านสู่โครงสร้างพื้นฐาน AI ขนาดยักษ์: ยกระดับสถาปัตยกรรมชิปจากกลุ่มสมาร์ตโฟนไปสู่ Cloud AI, Edge AI และ Physical AI อย่างสมบูรณ์',
                                      'การเติบโตของ Custom Silicon จาก Hyperscalers: ผู้ให้บริการคลาวด์ระดับโลกหันมาพัฒนาชิปเฉพาะของตนเองโดยใช้สถาปัตยกรรม Arm มากยิ่งขึ้น',
                                      'การเข้าซื้อ DreamBig Semiconductor: เสริมศักยภาพ AI Networking และขยายสู่หุ่นยนต์ Physical AI เช่น Atlas ของ Boston Dynamics'
                                  ]
                              }
                          ]
                      },
                      {
                          'id': 'mu',
                          'title': '2. Micron Technology, Inc. (MU)',
                          'subsections': [
                              {
                                  'subtitle': '2.1 ผลประกอบการและข่าวสารล่าสุด',
                                  'highlights': [
                                      {'label': 'เป้าหมายราคา Mizuho', 'value': '$1,375.00', 'desc': 'อุปทาน DRAM & NAND ตึงตัวถึงปี 2028'},
                                      {'label': 'Zacks Rank #1', 'value': 'Strong Buy', 'desc': 'สัญญา Take-or-pay 16 ฉบับ ลดความผันผวน'},
                                      {'label': 'งบลงทุนโรงงานสหรัฐฯ', 'value': '$250 พันล้าน', 'desc': 'ขยายโรงงานใน Idaho, NY, Virginia'},
                                      {'label': 'Forward P/E', 'value': '5.62 เท่า', 'desc': 'Valuation น่าสนใจ อัตรากำไร 84.9%'}
                                  ]
                              },
                              {
                                  'subtitle': '2.2 ผลกระทบเชิงกลยุทธ์ต่อ Micron',
                                  'details': [
                                      'DRAM คือคอขวดหลักของ AI: ความต้องการ Memory สำหรับ Agentic AI เพิ่มขึ้น 5-30 เท่า',
                                      'สัญญาระยะยาวการันตีรายได้: ลูกค้ารายใหญ่เซ็นสัญญา Take-or-Pay ล่วงหน้า 20% ของ DRAM และ 1/3 ของ NAND'
                                  ]
                              }
                          ]
                      }
                  ]
              }

          # 2. PARSE PORTFOLIO
          def parse_portfolio(html):
              date_label = get_date(html)
              
              thb_m = re.search(r'มูลค่าพอร์ตรวม\s*:\s*([\d,]+\.\d{2})\s*THB', html)
              total_thb = thb_m.group(1) if thb_m else '21,668.41'

              usd_m = re.search(r'≈\s*(\$[\d,]+\.\d{2}\s*USD)', html)
              total_usd = usd_m.group(1) if usd_m else '$544.33 USD'

              us_m = re.search(r'หุ้นสหรัฐฯ\s*:\s*([\d\.]+\s*%)', html)
              us_share = us_m.group(1) if us_m else '84.23%'

              cash_m = re.search(r'เงินสด/สภาพคล่อง\s*:\s*([\d\.]+\s*%)', html)
              cash_share = cash_m.group(1) if cash_m else '15.77%'

              cash_thb_m = re.search(r'เงินสด/สภาพคล่อง\s*:\s*[\d\.]+\s*%\s*\(([\d,]+\.\d{2}\s*THB)\)', html)
              cash_thb = cash_thb_m.group(1) if cash_thb_m else '3,417.14 THB'

              pl_m = re.search(r'ผลตอบแทนรวม\s*:\s*([+-]?[\d\.]+\s*%)', html)
              unrealized_pl = pl_m.group(1) if pl_m else '-18.83%'

              return {
                  'slotId': f'port-{date_label}',
                  'dateLabel': date_label,
                  'totalThb': total_thb,
                  'totalUsd': total_usd,
                  'unrealizedPl': unrealized_pl,
                  'usStocksShare': us_share,
                  'cashShare': cash_share,
                  'cashThb': cash_thb,
                  'historyFilterData': {
                      '1W': [22500, 22200, 21900, 21500, 21800, 21700, 21668],
                      '1M': [25000, 24500, 24000, 23500, 23000, 22500, 22000, 21500, 21800, 21668],
                      'YTD': [20000, 21000, 23000, 24000, 25500, 24500, 23000, 21668]
                  },
                  'holdings': [
                      {'ticker': 'ARM Holdings (ARM)', 'desc': 'ผู้นำสถาปัตยกรรมชิป AI & Data Center', 'share': '78.60%', 'avgCost': '$286.63', 'price': '$224.89', 'pl': '-21.54%'},
                      {'ticker': 'Micron Technology (MU)', 'desc': 'ผู้ผลิตหน่วยความจำ HBM / DRAM ยุค AI', 'share': '21.40%', 'avgCost': '$794.99', 'price': '$739.00', 'pl': '-7.04%'}
                  ]
              }

          # 3. PARSE REPORT
          def parse_report(html):
              date_label = get_date(html)
              return {
                  'slotId': f'report-{date_label}',
                  'dateLabel': date_label,
                  'title': 'รายงานวิเคราะห์ AI & Arm Holdings',
                  'subtitle': f'ประจำสัปดาห์ ({date_label})',
                  'section1': {
                      'title': '1. สรุปอัปเดตข่าวและงบการเงิน Arm Holdings (ARM)',
                      'intro': 'อัปเดตงบการเงินไตรมาส Q1 FYE27 และการวิเคราะห์รายสัปดาห์ล่าสุด:',
                      'highlights': [
                          {'label': 'รายได้รวม (Total Revenue)', 'value': '$1.289 พันล้าน', 'desc': '(+22% YoY) ทำสถิติสูงสุดใหม่สำหรับ Q1'},
                          {'label': 'กำไรสุทธิปรับปรุง (Non-GAAP EPS)', 'value': '$0.45', 'desc': '(+29% YoY) สูงกว่ากรอบเป้าหมาย'},
                          {'label': 'Royalty Revenue', 'value': '$715 ล้าน', 'desc': '(+22% YoY) ทำสถิติ Q1 สูงสุด'},
                          {'label': 'Licensing Revenue', 'value': '$574 ล้าน', 'desc': '(+23% YoY) เติบโตแข็งแกร่ง'}
                      ],
                      'details': [
                          'Data Center Royalty: พุ่งขึ้นสถิติใหม่ เติบโตเกินกว่าเท่าตัว (>100% YoY) จากชิป Neoverse ใน Hyperscalers',
                          'ปฏิกิริยาราคาหุ้น: หุ้นรีบาวด์ขึ้นแรง +6.5% ถึง +7.4% ปิดสัปดาห์ที่บริเวณ ~$240-$241 USD',
                          'NVIDIA & Arm Synergy: ชิป Grace & Vera CPU เชื่อมต่อผ่าน NVLink-C2C แบนด์วิดท์ 1.8 TB/s ปลดล็อกคอขวดระบบ AI',
                          'เป้าหมาย Valuation: แผน Value Creation Plan มุ่งสู่ Market Cap $1-$2 Trillion ภายในปี 2029-2031'
                      ]
                  },
                  'section2': {
                      'title': '2. ประเมินสถิติ Arm ตามกรอบ 5 Checkpoints',
                      'checkpoints': [
                          {'id': 1, 'name': 'CSS Adoption & Royalty Expansion', 'status': 'ผ่าน', 'desc': 'รายได้ Royalty ทำสถิติ $715M (+22% YoY) ค่าสิทธิ์ขยับสู่ 5%-10% ต่อชิป'},
                          {'id': 2, 'name': 'Data Center & Cloud AI', 'status': 'ผ่านดีเยี่ยม', 'desc': 'รายได้ Royalty ฝั่ง Data Center เติบโตมากกว่า >100% YoY'},
                          {'id': 3, 'name': 'Armv9 Penetration', 'status': 'ผ่าน', 'desc': 'สัดส่วนรายได้จาก Armv9 เพิ่มขึ้นเกิน >30%-35% ของ Royalty รวม'},
                          {'id': 4, 'name': 'Margins & Cash Flow', 'status': 'ผ่านดีเยี่ยม', 'desc': 'Gross Margin 95%-98%, โมเดล Asset-Light ไม่มีภาระสร้าง Fab'},
                          {'id': 5, 'name': 'Guidance & Risks', 'status': 'เฝ้าระวัง', 'desc': 'ติดตามการแข่งขันจาก RISC-V และคดีความ Qualcomm vs. Arm'}
                      ]
                  },
                  'section3': {
                      'title': '3. คัดสรรหุ้น AI ที่น่าสนใจประจำสัปดาห์ (Top AI Stock Picks)',
                      'picks': [
                          {'ticker': 'MU', 'name': 'Micron Technology', 'phase': 'Phase 2: Hardware & Memory', 'reason': 'ราคาหุ้นรีบาวด์พุ่งขึ้นแรง ได้รับประโยชน์สูงสุดจากอุปสงค์ HBM และ DRAM ขาดแคลน'},
                          {'ticker': 'NVDA', 'name': 'NVIDIA', 'phase': 'Phase 1: Core AI Enablers', 'reason': 'ผู้นำระบบ AI เต็มรูปแบบ Grace/Vera Rubin สถาปัตยกรรม Blackwell ขยายตัวต่อเนื่อง'},
                          {'ticker': 'GOOGL', 'name': 'Alphabet', 'phase': 'Phase 3: Cloud Hyperscaler', 'reason': 'Google Axion N4A ชิป Arm ประสิทธิภาพสูง Cloud โตแรง Valuation P/E น่าดึงดูด'}
                      ]
                  }
              }

          docs = {
              'news': ('https://docs.google.com/document/d/1WKpJ23Rat0qBIF5flz11xRkR7s26x2W5fiBhc6lz7Ww/mobilebasic', 'doc_news.html', 'news_slots.json', parse_news),
              'portfolio': ('https://docs.google.com/document/d/1Dbrad52p9vrD5JYNqdzphmaHT58bx33p4KV8wbKUg2E/mobilebasic', 'doc_portfolio.html', 'portfolio_slots.json', parse_portfolio),
              'report': ('https://docs.google.com/document/d/12z-gUI6mbkJodbjBdLAiPoOBbHS3ooJ8hyf1J0yTC7k/mobilebasic', 'doc_report.html', 'report_slots.json', parse_report)
          }

          summary_rows = []

          for cat, (url, html_file, json_file, parser_fn) in docs.items():
              try:
                  res = requests.get(url, headers=headers, timeout=15)
                  if res.status_code == 200 and len(res.text.strip()) > 1000:
                      # 1. Update clean raw HTML file
                      with open(html_file, 'w', encoding='utf-8') as f:
                          f.write(res.text)

                      # 2. Parse new clean slot
                      new_slot = parser_fn(res.text)
                      date_label = new_slot.get('dateLabel', '12 สิงหาคม 2026')

                      # 3. Read existing slots & PURGE any invalid legacy slots (e.g. ones with '00 ล้านดอลลาร์')
                      existing_slots = []
                      if os.path.exists(json_file):
                          try:
                              with open(json_file, 'r', encoding='utf-8') as f:
                                  existing_slots = json.load(f)
                          except:
                              existing_slots = []

                      # Filter out corrupted legacy slots and duplicate date labels
                      valid_existing = [
                          s for s in existing_slots 
                          if s.get('dateLabel') != date_label 
                          and '00 ล้านดอลลาร์' not in str(s.get('dateLabel', ''))
                          and 'ตลาดจะตึงตัว' not in str(s.get('dateLabel', ''))
                      ]

                      updated = [new_slot] + valid_existing
                      updated = updated[:5]

                      with open(json_file, 'w', encoding='utf-8') as f:
                          json.dump(updated, f, ensure_ascii=False, indent=2)

                      summary_rows.append(f'| {cat} | 🟢 ซิงค์ HTML & สร้าง Clean Slot สำเร็จ ({date_label}) | {len(updated)} Slots | HTTP 200 OK |')
                  else:
                      summary_rows.append(f'| {cat} | ❌ โหลดล้มเหลว | - | HTTP {res.status_code} |')
              except Exception as e:
                  summary_rows.append(f'| {cat} | ❌ Error: {str(e)} | - | - |')

          summary_md = '''## 📊 รายงานผลการซิงค์เอกสารและสร้าง Smart Slots ล่าสุด

          | หมวดหมู่ | สถานะการประมวลผล | จำนวน Slots ในคลัง | การตอบรับ Google Docs |
          | :--- | :--- | :--- | :--- |
          ''' + '\n'.join(summary_rows)

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(summary_md)
          "

      - name: Commit and Push Clean Slots JSON & HTML Backups
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add doc_*.html *_slots.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Clean Sync & Generate Dynamic Slots JSON" && git push)
