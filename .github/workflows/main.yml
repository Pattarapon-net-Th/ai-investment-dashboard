name: ซิงค์ Google Docs 3 รายการไปยังแดชบอร์ด

on:
  schedule:
    - cron: '0 * * * *' # ทำงานอัตโนมัติทุกๆ 1 ชั่วโมง
  workflow_dispatch: # ปุ่มกดสั่งรันด้วยตัวเอง

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch Google Docs Data
        run: |
          python -c "
          import requests
          
          # ลิงก์ Publish to web ของ Google Docs ทั้ง 3 ไฟล์
          urls = {
              'doc_news.html': 'ใส่ลิงก์_PUBLISH_TO_WEB_หมวดข่าวสาร',
              'doc_portfolio.html': 'ใส่ลิงก์_PUBLISH_TO_WEB_หมวดสถานะพอร์ต',
              'doc_report.html': 'ใส่ลิงก์_PUBLISH_TO_WEB_หมวดรายงานวิเคราะห์'
          }

          headers = {'User-Agent': 'Mozilla/5.0'}
          for filename, url in urls.items():
              if 'pub' in url:
                  res = requests.get(url, headers=headers)
                  if res.status_code == 200:
                      with open(filename, 'w', encoding='utf-8') as f:
                          f.write(res.text)
                      print(f'Successfully downloaded {filename}')
          "

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add doc_news.html doc_portfolio.html doc_report.html || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Sync latest 3 Google Docs content" && git push)
