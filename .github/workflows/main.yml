name: ซิงค์และสร้างแดชบอร์ดอัจฉริยะ (SOP Clean Sync)

on:
  schedule:
    - cron: '*/30 * * * *' # ⏰ รันประมวลผลอัตโนมัติทุกๆ 30 นาที
  workflow_dispatch: # ปุ่มกดสั่งรันด้วยตัวเองได้ตลอดเวลา

permissions:
  contents: write

jobs:
  sync-transform-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Clean Dynamic Slots Sync
        run: python sync_dashboard.py

      - name: Commit and Push Clean Slots JSON & HTML Backups
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add doc_*.html *_slots.json sync_dashboard.py || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Clean Sync & Generate Dynamic Slots JSON" && git push)
